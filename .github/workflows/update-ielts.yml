name: Update IELTS Stats

on:
  schedule:
    # 00:00 UTC = 07:00 Vietnam time
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Update README
        env:
          YOUPASS_TOKEN: ${{ secrets.YOUPASS_TOKEN }}
        run: node scripts/update-ielts.js

      - name: Commit and push changes
        run: |
          if git diff --quiet README.md; then
            echo "No IELTS stats changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update IELTS stats [skip ci]"
          git push
