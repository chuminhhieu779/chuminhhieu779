name: Update IELTS Stats

on:
  schedule:
    # 00:00 UTC = 07:00 Vietnam time
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Checkout Daily Reading source
        uses: actions/checkout@v6
        with:
          repository: midori-suzune/Practice-English-Daily
          ref: master
          path: practice-english-daily

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Update IELTS streak badge
        env:
          YOUPASS_TOKEN: ${{ secrets.YOUPASS_TOKEN }}
        run: node scripts/update-ielts-streak.js

      - name: Update vocab badge
        env:
          YOUPASS_TOKEN: ${{ secrets.YOUPASS_TOKEN }}
        run: node scripts/update-vocab-badge.js

      - name: Update IELTS progress stats
        env:
          YOUPASS_TOKEN: ${{ secrets.YOUPASS_TOKEN }}
        run: node scripts/update-ielts.js

      - name: Update Daily Reading
        env:
          DAILY_READING_PATH: practice-english-daily/Reading
        run: node scripts/update-daily-reading.js

      - name: Commit and push changes
        run: |
          if git diff --quiet README.md assets/ielts-streak.svg assets/vocab-learned.svg assets/daily-reading.json; then
            echo "No learning stats changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/ielts-streak.svg assets/vocab-learned.svg assets/daily-reading.json
          git commit -m "Update learning stats [skip ci]"
          git push
